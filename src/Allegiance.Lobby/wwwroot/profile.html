<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allegiance Lobby — Pilot Profile</title>
  <link rel="stylesheet" href="career.css">
  <script src="profile.js" defer></script>
</head>
<body>
  <a class="back" href="/">&larr; Server directory</a>
  <a class="back" href="/ladder.html">&larr; Career ladder</a>
  <p class="eyebrow">ALLEGIANCE / PILOT PROFILE</p>
  <h1 id="title">Loading&hellip;</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="profile" hidden>
    <div class="card">
      <p id="description" class="desc"></p>
      <div class="stat-grid">
        <div class="stat"><div class="k">Overall rating</div><div class="v" id="rating">—</div></div>
        <div class="stat"><div class="k">Civilizations played</div><div class="v" id="civcount">—</div></div>
        <div class="stat"><div class="k">Career score</div><div class="v" id="totalscore">—</div></div>
        <div class="stat"><div class="k">Time played</div><div class="v" id="totaltime">—</div></div>
      </div>
    </div>
    <h2>Career by civilization</h2>
    <table id="civs">
      <thead><tr>
        <th>Civ</th><th>Rank</th><th class="num">Score</th><th class="num">Rating</th>
        <th class="num">Time</th><th class="num">Kills</th><th class="num">Deaths</th>
        <th class="num">Wins</th><th class="num">Losses</th><th class="num">Base kills</th><th class="num">Base captures</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>
</body>
</html>
