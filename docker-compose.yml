# Fresh-clone trial: docker compose up --build.
# The one-shot artwork service downloads the public native core/map into a named
# volume; production deployments can replace the server's /artwork mount.
services:
  artwork:
    image: alpine:3.22.2
    volumes:
      - trial-artwork:/artwork
      - ./docker/fetch-trial-artwork.sh:/fetch-trial-artwork.sh:ro
    entrypoint: ["sh", "/fetch-trial-artwork.sh"]
    restart: "no"

  lobby:
    build:
      context: .
      dockerfile: src/Allegiance.Lobby/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Lobby__Identity__PublicUrl: "${ALLEGIANCE_LOBBY_PUBLIC_URL:-http://localhost:8080}"
      Lobby__Identity__Store: Sqlite
      Lobby__Identity__ConnectionString: Data Source=/identity/accounts.db
      Lobby__Identity__SigningKeyFile: /identity/signing-key.pem
      Lobby__Identity__PublicKeyFile: /trust/public-key.pem
      Lobby__Identity__OperatorAccountIds__0: "${ALLEGIANCE_LOBBY_OPERATOR_ID:-}"
      # P820b — the configurable Zone web link shown on the client's online hub
      # (served read-only via GET /api/config/zone-web). Empty = link omitted.
      Lobby__ZoneWebUrl: "${ALLEGIANCE_LOBBY_ZONE_WEB_URL:-}"
      # P894 — the lobby ⇄ server protocol version (native LOBBYVER_LS). A server
      # that states a different version is refused at registration; unset hosts
      # are still accepted. Usually left at the default (1).
      Lobby__LobbyProtocolVersion: "${ALLEGIANCE_LOBBY_PROTOCOL_VERSION:-1}"
      # P894 — native's approved-server IP list (`IsServerAllowed`,
      # lobby/server.cpp:24-84). Comma-separated addresses; empty (the default)
      # accepts every server, so community hosts keep listing. Loopback is always
      # allowed. Mode `allow` (default) or `block`. The list is deliberately NOT
      # set here (an empty env value would become a blank entry): add
      # `Lobby__AllowedServers__0: "<address>"` in a private compose override.
      Lobby__ServerFilterMode: "${ALLEGIANCE_LOBBY_SERVER_FILTER_MODE:-allow}"
      # P894 — the native percent-load metric's inputs (c_GameFactor=5,
      # m_maxLoad=300; lobby/server.h:17,70-73). Advertised, not enforced.
      Lobby__GameFactor: "${ALLEGIANCE_LOBBY_GAME_FACTOR:-5}"
      Lobby__MaxLoad: "${ALLEGIANCE_LOBBY_MAX_LOAD:-300}"
      # Providers are deliberately off. Enable explicitly with credentials from
      # your environment or a private, ignored compose override; see docker/README.md.
      Lobby__Identity__GitHub__Enabled: "false"
      Lobby__Identity__Google__Enabled: "false"
      Lobby__Identity__Steam__Enabled: "false"
    volumes:
      - lobby-identity:/identity
      - lobby-trust:/trust
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Optional bot owner transfer uses botAuthenticationSecret in the mounted server JSON.
  # null disables the role; keep real credentials in a private config override.
  server:
    build:
      context: .
      dockerfile: src/Allegiance.Server/Dockerfile
    command: ["--identity-issuer", "${ALLEGIANCE_LOBBY_PUBLIC_URL:-http://localhost:8080}"]
    ports:
      - "6073:6073"
    volumes:
      - trial-artwork:/artwork:ro
      - ./docker/compose.server.json:/app/server.json:ro
      - lobby-trust:/lobby-trust:ro
      - server-identity:/server-identity
    depends_on:
      artwork:
        condition: service_completed_successfully
      lobby:
        condition: service_healthy
    environment:
      # P832a: JSON goal override for every configured game (empty preserves games[].goals).
      ALLEGIANCE_GAME_GOALS: "${ALLEGIANCE_GAME_GOALS:-}"
      # P856: native create-game options for every configured game
      # (empty preserves games[].allowFriendlyFire / games[].allowAlliedViz; both default off).
      ALLEGIANCE_GAME_ALLOW_FRIENDLY_FIRE: "${ALLEGIANCE_GAME_ALLOW_FRIENDLY_FIRE:-}"
      ALLEGIANCE_GAME_ALLOW_ALLIED_VIZ: "${ALLEGIANCE_GAME_ALLOW_ALLIED_VIZ:-}"
      # P864c: opt out of replacing an old seat for the same verified account.
      ALLEGIANCE_ALWAYS_REFUSE_DUPLICATE_LOGONS: "${ALLEGIANCE_ALWAYS_REFUSE_DUPLICATE_LOGONS:-}"
      # P894: the minimum client release this server admits at logon (the
      # advertised `minClientVersion`, now also ENFORCED at LOGONREQ with a clear
      # update reason). Empty = no minimum, like a native lobby without AutoUpdate.
      ALLEGIANCE_MINIMUM_CLIENT_VERSION: "${ALLEGIANCE_MINIMUM_CLIENT_VERSION:-}"
      # EXPERIMENTAL flags: default off; kept or dropped by the 200v200 two-match A/B.
      # P817 — native NPC travel (docs/reports/P817_NATIVE_GOTOPLAN.md).
      ALLEGIANCE_SIM_NATIVE_GOTOPLAN: "${ALLEGIANCE_SIM_NATIVE_GOTOPLAN:-0}"
      # P788c — native broadcast-before-update scheduling.
      ALLEGIANCE_SIM_NATIVE_BROADCAST_ORDER: "${ALLEGIANCE_SIM_NATIVE_BROADCAST_ORDER:-0}"
      # P813d — the reliable one-shot park lane (docs/reports/P813D_RELIABLE_TIER_AUDIT.md).
      ALLEGIANCE_TRANSPORT_RELIABLE_ONESHOT: "${ALLEGIANCE_TRANSPORT_RELIABLE_ONESHOT:-0}"
    restart: unless-stopped

volumes:
  trial-artwork:
  lobby-identity:
  lobby-trust:
  server-identity:
