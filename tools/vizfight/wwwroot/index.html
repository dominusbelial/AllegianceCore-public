<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VizFight — sector explorer (P46)</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060c;overflow:hidden;font-family:system-ui,sans-serif}
  #scene{position:fixed;inset:0;display:block}
  #hud{position:fixed;left:14px;bottom:12px;color:#9fb0c8;font:12px/1.5 ui-monospace,monospace;
       background:rgba(5,8,16,.72);border:1px solid #1c2740;padding:8px 12px;border-radius:8px;max-width:560px;
       white-space:pre-wrap;pointer-events:none}
  #stats{position:fixed;left:14px;top:12px;color:#cfe0ff;font:13px ui-monospace,monospace;
         background:rgba(5,8,16,.72);border:1px solid #1c2740;padding:6px 10px;border-radius:8px}
  #sectorbox{position:fixed;left:14px;top:52px;color:#cfe0ff;font:12px ui-monospace,monospace;
         background:rgba(5,8,16,.72);border:1px solid #1c2740;padding:8px 10px;border-radius:8px}
  #sectorbox label{color:#9fb0c8}
  select{background:#0b1524;color:#cfe0ff;border:1px solid #2a3f66;border-radius:4px;padding:2px 6px;font:12px ui-monospace,monospace}
  #legend{position:fixed;right:14px;top:12px;color:#cfe0ff;font:12px/1.8 ui-monospace,monospace;
          background:rgba(5,8,16,.72);border:1px solid #1c2740;padding:8px 12px;border-radius:8px}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
  #warpkey{display:inline-block;width:10px;height:10px;border:2px solid #7fd6ff;border-radius:50%;margin-right:7px;vertical-align:middle}
  #stationkey{display:inline-block;width:10px;height:10px;background:#ffb054;margin-right:7px;vertical-align:middle}
  #rockkey{display:inline-block;width:10px;height:10px;background:#8c6b4f;border-radius:2px;margin-right:7px;vertical-align:middle}
  #kills{position:fixed;right:14px;top:150px;color:#ffd76a;font:12px ui-monospace,monospace;text-align:right}
  /* P59: live notable-moment feed (dock/undock/mine/payday/warp). Anchored
     bottom-right — clear of the HUD/stats/sectorbox (left edge), the legend
     (right-top) and the kills panel (right-middle). Lines are capped in JS
     (see appendEvent) so it never grows unbounded over a long demo. */
  #events{position:fixed;right:14px;bottom:12px;width:360px;max-height:42vh;
          background:rgba(5,8,16,.72);border:1px solid #1c2740;border-radius:8px;padding:8px 12px;
          font:12px/1.5 ui-monospace,monospace;color:#9fb0c8;overflow:hidden}
  #events .ev-title{color:#5c6f8c;margin-bottom:4px;letter-spacing:.04em}
  #eventsFeed{overflow-y:auto;max-height:calc(42vh - 22px)}
  #eventsFeed div{padding:1px 0;border-bottom:1px dashed rgba(28,39,64,.5);white-space:nowrap}
  #eventsFeed div:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">connecting…</div>
<div id="stats">ws: connecting</div>
<div id="sectorbox"><label>focus sector:</label> <select id="sectorSel"><option value="">—</option></select><br><span id="sectorInfo">(no sector focused yet)</span></div>
<div id="legend">
  <span><span class="swatch" style="background:#00c8ff"></span>side 0</span><br>
  <span><span class="swatch" style="background:#ff5050"></span>side 1</span><br>
  <span><span id="warpkey"></span>warp (glowing ring at its trigger radius)</span><br>
  <span><span id="stationkey"></span>station</span><br>
  <span><span id="rockkey"></span>asteroid (darker = more depleted)</span>
</div>
<div id="kills"></div>
<div id="events"><div class="ev-title">live events</div><div id="eventsFeed"></div></div>

<!-- Three.js pinned at r170 (package 0.170.0), same import-map as P44. Served
     by vizfight's own Kestrel on 127.0.0.1:<port>. No bundler/no build step —
     this stays a single static file. URL versions pinned, not "latest". -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────────────────────────── scene / renderer / camera ──────────────────────
const SCENE = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
SCENE.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);

// Lighting: dim ambient so side colors read, plus a directional light for form.
scene.add(new THREE.AmbientLight(0x556078, 1.4));
const dirLight = new THREE.DirectionalLight(0xfff3e0, 2.2);
dirLight.position.set(600, 800, 600);
scene.add(dirLight);

// Starfield: ~480 point sprites on a distant sphere shell for spatial anchor.
(function stars(){
  const geo = new THREE.BufferGeometry();
  const N = 480, arr = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const dir = new THREE.Vector3(
      Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
    if (dir.lengthSq() < 1e-4) continue;
    dir.normalize().multiplyScalar(4200 + Math.random()*900);
    arr[i*3]=dir.x; arr[i*3+1]=dir.y; arr[i*3+2]=dir.z;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const mat = new THREE.PointsMaterial({ color:0xbfd4ff, size:3, sizeAttenuation:true, transparent:true, opacity:0.9 });
  scene.add(new THREE.Points(geo, mat));
})();

// Axis helper for orientation (Red=X, Green=Y, Blue=Z). Optional aid, harmless.
scene.add(new THREE.AxesHelper(300));

// Camera framed by the current focus sector (see reframeCamera). OrbitControls
// handles manual orbit/zoom/pan on top of that starting frame.
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 60000);
camera.up.set(0,1,0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;

// P185(experiment) audio proof-of-concept: a positional kill/explosion cue.
// THREE.PositionalAudio needs an AudioListener attached to the camera (its
// position/orientation each frame is what gives the sound its stereo pan +
// falloff) and a decoded AudioBuffer to play from. The source .ogg is one of
// the original game's real sound assets, served by the server from its own
// ALLEGIANCE_ARTWORK_PATH tree (see Program.cs's "/audio" static mapping) --
// never copied into this repo. Browsers require a user gesture before audio
// can play, so resume the (suspended-by-default) AudioContext on first click.
const audioListener = new THREE.AudioListener();
camera.add(audioListener);
document.addEventListener('click', () => {
  if (audioListener.context.state === 'suspended') audioListener.context.resume();
}, { once: true });

const explosionBuffer = { current: null };
new THREE.AudioLoader().load('/audio/explosionshockwave.ogg',
  (buf) => { explosionBuffer.current = buf; console.log('[audio] explosionshockwave.ogg loaded,', buf.duration.toFixed(2), 's'); },
  undefined,
  (err) => console.error('[audio] failed to load explosionshockwave.ogg', err));

/** Play the explosion cue once, positioned at `pos` ([x,y,z], the same
 * right-handed sim coordinates every ship mesh is placed in). A fresh
 * PositionalAudio + a throwaway Object3D per call (not reused) -- simplest
 * correct thing for a one-shot sound; the object self-removes once playback
 * ends via 'ended'. No-op if the buffer hasn't finished loading yet or the
 * context is still suspended (pre-gesture).*/
function playPositional(pos){
  if (!explosionBuffer.current) return;
  const anchor = new THREE.Object3D();
  anchor.position.set(pos[0], pos[1], pos[2]);
  const sound = new THREE.PositionalAudio(audioListener);
  sound.setBuffer(explosionBuffer.current);
  sound.setRefDistance(150);     // falloff scale tuned to this scene's sim-unit sizes (ships ~10-50 units)
  sound.setVolume(0.8);
  anchor.add(sound);
  scene.add(anchor);
  sound.onEnded = () => { scene.remove(anchor); sound.disconnect(); };
  if (audioListener.context.state === 'running') {
    sound.play();
    console.log('[audio] playing explosionshockwave at', pos, 'ctx state', audioListener.context.state);
  } else {
    console.log('[audio] skipped -- context state is', audioListener.context.state, '(needs a page click first)');
  }
}

// Auto-follow: reframeCamera() only ever runs on discrete events (focus
// change, a ship spawning) — a ship that flies far from where it started
// (confirmed live, P69-P71: a real undocked ship covers thousands of units
// in seconds) drifts out of that original framing with nothing to bring it
// back into view, even though its telemetry keeps updating correctly. Not
// wired to fire on every tick (20 Hz) — that would fight a manual
// drag/zoom constantly. Instead: pause auto-reframe for a few seconds after
// the user last touched the camera, then resume on a slow cadence so a
// ship crossing the frame gets recentered without the view visibly
// snapping every tick.
let lastUserCameraInputMs = 0;
let lastAutoReframeMs = 0;
const AUTO_REFRAME_IDLE_MS = 2500;     // wait this long after manual input before auto-framing again
const AUTO_REFRAME_INTERVAL_MS = 1500; // re-fit at most this often
controls.addEventListener('start', () => { lastUserCameraInputMs = performance.now(); });
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ──────────────────── colors / geometry (shared primitives) ─────────────────
const SIDE_COLOR = [0x00c8ff, 0xff5050];      // side 0 = cyan, side 1 = red
const DYING_FLASH = 0xffffff;
// P49: a ship that stops appearing in `tick` for this many consecutive ticks
// is presumed disconnected/crashed and gets despawned. Real cadence is 20/s,
// so 5 ticks ≈ 250 ms — comfortably beyond a genuine glitch, and a live ship
// (which ticks every tick) can never accumulate this many misses.
const GHOST_TICKS = 5;

// Cone geometry, radius 18 length 62, apex at +Y (axis-aligned). Shared.
// Origin shifted so it sits at the cone's base center. Identical to P44.
const CONE_GEO = new THREE.ConeGeometry(18, 62, 14);
CONE_GEO.translate(0, 31, 0);
const UP = new THREE.Vector3(0, 1, 0);        // cone's native nose axis (+Y)

// P204 per-kind schematic colours + sizes for non-ship models — distinct
// simple primitives (coloured spheres), matching this tool's existing
// generic/schematic style, not hull-specific or game-art-mimicking shapes.
const MODEL_STYLE = {
  projectile: { color: 0xffe14d, scale: 11 },
  missile:    { color: 0xff8c42, scale: 13 },
  mine:       { color: 0x66ff88, scale: 18 },
  chaff:      { color: 0xdcdcff, scale: 20 },
  treasure:   { color: 0xffd76a, scale: 15 },
};
const MODEL_GEO = new THREE.SphereGeometry(1, 10, 8);

// Static-sector geometry lives in its own group, rebuilt on each focus change.
const geomGroup = new THREE.Group();
scene.add(geomGroup);

// ─────────────────────────── state management ──────────────────────────────
// sector id → { id, name, warps[], stations[] }. Every 'sector' message P45
// sends is recorded, regardless of focus (requirement 1).
const sectors = new Map();
// Focused sector id. Null until the first ship is seen (requirement 1:
// default = the sector the first ship you ever see is in), then user-changeable
// via the dropdown. Remains fixed until the user changes it.
let focusId = null;
// Every ship's latest state, keyed by id — tracked even when NOT rendered
// (requirement 2), so switching focus instantly shows correct positions.
const shipState = new Map();
// Every ship's mesh, keyed by id — spawned on first sight, kept alive, and
// toggled visible/in the scene based on focus (requirement 2: rendered iff
// its current sector === focusId). Meshes elsewhere are still updated.
const shipMeshes = new Map();
// Explore vs combat mode: combat (P44) never emits 'sector' messages; the
// first 'sector' message flips this page into explore mode. Until then ships
// render unfiltered, preserving P44's live-combat view against the default
// backend. One file serves both modes, no build step.
let exploreMode = false;
// P204: mode is classified ONCE from the first ship-bearing tick (explore
// ships always carry a real `sector`; combat ships never do) — a sector
// message no longer implies explore, because the fight scenario now sends
// sector geometry too. Until classified, `exploreMode` is provisional.
let modeClassified = false;
const elapsedSector = new Map();             // sectorId → sec since first ship seen there (active-sector list)
// Real per-sector ship counts (sectorId string → count), from the server's
// 'sectorCensus' message (attach mode only — see BroadcastAttach). Combat
// ships carry no per-ship `sector` field on the wire (the explore/combat
// classifier below relies on that), so this is the only true source for
// where ships actually are in combat mode; null until the first census
// arrives, so other modes (which never send it) keep their prior behavior.
let sectorCensus = null;
// P204: every non-ship model (projectile/mine/missile/chaff/treasure) is
// tracked with the same spawn/update/prune lifecycle the ships use —
// modelState stamps lastSeenTick so the shared GHOST_TICKS rule prunes
// short-lived kinds once they stop appearing in the stream.
const modelState = new Map();      // model id -> { lastSeenTick }
const modelMeshes = new Map();     // model id -> { mesh, mat }

const hudEl = document.getElementById('hud');
const statsEl = document.getElementById('stats');
const selEl = document.getElementById('sectorSel');
const infoEl = document.getElementById('sectorInfo');
const killsEl = document.getElementById('kills');
const eventsFeedEl = document.getElementById('eventsFeed');
let simTime = 0, connCount = 0;
let tickCount = 0;             // bumped once per tick message; powers ghost pruning
let ws, reconnectTimer = null;

// ─────────────────────── sector focus / geometry / camera ──────────────────
// Populate/refresh the dropdown from every sector id we've seen a 'sector'
// message for. Rebuild on every 'sector' arrival (cheap; keeps new sectors
// selectable immediately). Does not disturb the current selection value.
function rebuildSelector(){
  const current = selEl.value === '' ? null : Number(selEl.value);
  selEl.textContent = '';
  const seen = [...sectors.keys()].sort((a,b)=>a-b);
  if (seen.length === 0){
    const o = document.createElement('option');
    o.value = ''; o.textContent = '—'; selEl.appendChild(o);
  } else {
    const placeholder = document.createElement('option');
    placeholder.value = ''; placeholder.textContent = '(choose sector)';
    selEl.appendChild(placeholder);
    for (const id of seen){
      const s = sectors.get(id);
      const o = document.createElement('option');
      o.value = String(id);
      o.textContent = `${id} · ${s.name}`;
      selEl.appendChild(o);
    }
  }
  if (current !== null && sectors.has(current)) selEl.value = String(current);
}

// Draw the focused sector's warps (glowing torus rings at their real pos,
// sized to their real trigger radius) and stations (boxes at their pos).
// Called on every focus change. Reads only the cached sector messages.
function drawFocusGeometry(){
  // dispose old meshes from the shared static-geometry group
  for (const m of [...geomGroup.children]){
    geomGroup.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material){
      if (Array.isArray(m.material)) m.material.forEach(x=>x.dispose());
      else m.material.dispose();
    }
  }
  const sec = sectors.get(focusId);
  if (!sec) return;
  // warps — a THIN RING oriented like a doorway (in the XZ plane), radius =
  // the warp's real trigger radius (P41/P42's proven collision volume, so a
  // viewer sees WHY a crossing happens where it does). Emissive cyan glow.
  const tubeGeo = new THREE.TorusGeometry(1, 1, 12, 32);  // unit ring, scaled per warp
  for (const w of sec.warps){
    const mat = new THREE.MeshStandardMaterial({
      color: 0x9be8ff, emissive: new THREE.Color(0x7fd6ff),
      emissiveIntensity: 0.9, roughness: 0.3, metalness: 0.1 });
    const ring = new THREE.Mesh(tubeGeo, mat);
    const p = w.pos;
    ring.position.set(p[0], p[1], p[2]);
    const R = Math.max(20, w.radius);                     // trigger radius (r170 Torus)
    ring.scale.set(R, R, R * 0.045);                      // x/y = radius, z thin
    ring.rotation.x = Math.PI / 2;                        // lay the ring in the XZ plane
    geomGroup.add(ring);
  }
  // stations — simple boxes at their real pos.
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  for (const st of sec.stations){
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffb054, emissive: new THREE.Color(0xff9030),
      emissiveIntensity: 0.35, roughness: 0.5, metalness: 0.3 });
    const box = new THREE.Mesh(boxGeo, mat);
    const p = st.pos;
    box.position.set(p[0], p[1], p[2]);
    box.scale.set(120, 90, 120);                          // box approx: 120×90×120
    geomGroup.add(box);
  }
  // asteroids — rough grey-brown rocks (icosahedra, not perfect spheres, so
  // they read as rocks rather than planets/moons). Sized by their real
  // trigger radius like warps; darkened toward black as they deplete
  // (oreFraction is a first-sight snapshot, not live, see SectorMessageJson).
  const rockGeo = new THREE.IcosahedronGeometry(1, 0);
  for (const a of (sec.asteroids || [])){
    const shade = 0.25 + 0.55 * (a.oreFraction ?? 1);
    const col = new THREE.Color(shade * 0.55, shade * 0.42, shade * 0.32);
    const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.95, metalness: 0.05, flatShading: true });
    const rock = new THREE.Mesh(rockGeo, mat);
    const p = a.pos;
    rock.position.set(p[0], p[1], p[2]);
    const R = Math.max(15, a.radius || 30);
    rock.scale.set(R, R * 0.85, R * 1.1);                 // slightly irregular, not a perfect ball
    rock.rotation.set(p[0] % 3, p[1] % 3, p[2] % 3);       // deterministic-but-varied orientation
    geomGroup.add(rock);
  }
  tubeGeo.dispose(); boxGeo.dispose(); rockGeo.dispose();
}

// Apply the current focus: toggle which ships are in the scene and (re)draw
// geometry + frame the camera. Correct positions for newly-shown ships were
// already tracked continuously, so no re-sync is needed.
// A ship's real position sector, when known: `realSector` (attach mode —
// present regardless of explore/combat classification, additive so it never
// affects that classifier) beats the explore-only `sector` field.
function realSectorOf(st){ return st ? (st.realSector ?? st.sector ?? null) : null; }

// THE scene-membership rule, shared by every add/remove site (applyFocus,
// the per-tick re-check, and the per-tick enforcement sweep below — they
// MUST agree, or one undoes another; the pre-fix bug was the enforcement
// sweep using a stale `exploreMode ? … : true` rule that re-added every
// combat/attach ship each tick right after applyFocus removed it).
// A ship with a known real sector (attach `realSector`, or explore's
// `sector`) renders iff it's in the focused sector; a ship with NO sector
// info at all (classic combat/showcase — never sends realSector) renders
// always, exactly as before.
function shipMatchesFocus(st){
  const rs = realSectorOf(st);
  return rs != null ? (rs === focusId) : (st && exploreMode) ? (st.sector === focusId) : true;
}

// Strict variant for camera framing/follow ONLY: a ship with no sector info
// (classic combat) is EXCLUDED from the framing points, matching the
// pre-realSector behavior of reframeCamera/followShips exactly.
function shipInFocusedSector(st){
  if (!st) return false;
  const rs = realSectorOf(st);
  return rs != null ? (rs === focusId) : (exploreMode && st.sector === focusId);
}

function applyFocus(){
  for (const [id, e] of shipMeshes){
    const st = shipState.get(id);
    const match = shipMatchesFocus(st);
    const inScene = scene.getObjectById(e.mesh.id) === e.mesh;
    if (match && !inScene) scene.add(e.mesh);
    else if (!match && inScene) scene.remove(e.mesh);
    if (match && st) updateShipVisual(st, e);   // refresh for freshly shown ships
  }
  drawFocusGeometry();
  reframeCamera();
  renderHUD();
}

// Chase-cam on whichever ship is actually moving, for the throttled
// auto-follow tick. reframeCamera()'s own bounding-box fit (warps +
// stations + asteroids + every visible ship) breaks down for this: a
// docked ship sits essentially AT its station, so even excluding static
// geometry, a box spanning "docked ship" to "ship that just flew
// thousands of units away" (confirmed live, P69-P71) still forces the
// same wide zoom-out that shrinks the one ship actually worth watching to
// a sub-pixel dot. Tracks per-ship movement since the last check
// (lastFollowPos) and centers tightly, at a fixed distance, on whichever
// ship moved the most — the "doing something" ship, not a fit-everything
// average. Falls back to reframeCamera()'s full-scene fit when nothing
// has moved enough to tell (e.g. right after a dock, before any real
// flight starts).
const lastFollowPos = new Map();     // shipId -> THREE.Vector3, previous auto-follow sample
const FOLLOW_DIST = 900;             // fixed chase distance; independent of ship separation
function followShips(){
  if (focusId === null) return;
  let subject = null, subjectMove = 0;
  for (const [id, e] of shipMeshes){
    const st = shipState.get(id);
    if (!shipInFocusedSector(st)) continue;
    const prev = lastFollowPos.get(id);
    const moved = prev ? prev.distanceTo(e.mesh.position) : 0;
    lastFollowPos.set(id, e.mesh.position.clone());
    if (moved > subjectMove){ subjectMove = moved; subject = e.mesh.position; }
  }
  if (!subject || subjectMove < 5){ reframeCamera(); return; }   // nothing moving meaningfully — full-scene fit
  camera.position.set(
    subject.x + FOLLOW_DIST * 0.7071,
    subject.y + FOLLOW_DIST * 0.8660,
    subject.z + FOLLOW_DIST * 0.6036);
  camera.lookAt(subject);
  controls.target.copy(subject);
  controls.update();
}

// Frame the camera to fit the focused sector's geometry + visible ships.
// distance = bounding-sphere-radius × constant; look at the center. Enough —
// OrbitControls lets the user refine from there.
function reframeCamera(){
  if (focusId === null) return;
  const sec = sectors.get(focusId);
  const pts = [];
  if (sec){
    for (const w of sec.warps) pts.push(new THREE.Vector3(w.pos[0], w.pos[1], w.pos[2]));
    for (const st of sec.stations) pts.push(new THREE.Vector3(st.pos[0], st.pos[1], st.pos[2]));
    for (const a of (sec.asteroids || [])) pts.push(new THREE.Vector3(a.pos[0], a.pos[1], a.pos[2]));
  }
  for (const [id, e] of shipMeshes){
    const st = shipState.get(id);
    if (!shipInFocusedSector(st)) continue;
    pts.push(e.mesh.position.clone());
  }
  if (pts.length === 0) return;
  const min = new THREE.Vector3(Infinity, Infinity, Infinity);
  const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (const p of pts){ min.min(p); max.max(p); }
  const center = new THREE.Vector3().addVectors(min, max).multiplyScalar(0.5);
  const radius = center.distanceTo(max);
  const dist = Math.max(400, radius * 2.4);
  camera.position.set(
    center.x + dist * 0.7071,      // elevated 45° off +X
    center.y + dist * 0.8660,      // more height than lateral
    center.z + dist * 0.6036);
  camera.lookAt(center);
  controls.target.copy(center);
  controls.update();
}

// ─────────────────────────── ship creation / update ────────────────────────
function spawnShip(s){
  const mat = new THREE.MeshStandardMaterial({
    color: SIDE_COLOR[s.side] ?? 0x888888,
    emissive: new THREE.Color(SIDE_COLOR[s.side] ?? 0x555555),
    emissiveIntensity: 0.35, roughness: 0.55, metalness: 0.25 });
  const mesh = new THREE.Mesh(CONE_GEO.clone(), mat);
  mesh.userData.id = s.id;

  // Health bar: a Sprite (always camera-facing) with a canvas texture.
  const barMat = new THREE.SpriteMaterial({ map: makeBarTexture(),
    depthTest: false, transparent: true });
  const bar = new THREE.Sprite(barMat);
  bar.position.y = 30;
  mesh.add(bar);

  const e = { mesh, mat, bar };
  shipMeshes.set(s.id, e);
  // In explore mode the ship is only in the scene if it's in the focused
  // sector; in combat mode it's always in UNLESS a real sector is known
  // (attach mode), in which case it behaves like explore. Mesh is created
  // regardless so its state stays tracked (requirement 2).
  if (shipMatchesFocus(s)) scene.add(mesh);
}

// Push live state into an existing mesh. Shared with P44; called on every
// tick (whether or not the mesh is currently rendered — position stays fresh).
function updateShipVisual(s, e){
  e.mesh.position.set(s.pos[0], s.pos[1], s.pos[2]);
  const fwd = new THREE.Vector3(s.fwd[0], s.fwd[1], s.fwd[2]);
  if (fwd.lengthSq() > 0) e.mesh.quaternion.setFromUnitVectors(UP, fwd.clone().normalize());
  e.bar.scale.set(Math.max(0.0001, s.hp) * 36, 4, 1);
  const base = SIDE_COLOR[s.side] ?? 0x888888;
  const c = new THREE.Color(base);
  c.lerp(new THREE.Color(0xcc2222), (1 - s.hp) * 0.9);
  e.mat.color.copy(c);
}

function makeBarTexture(){
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 8;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0b1524';
  ctx.fillRect(0, 0, 64, 8);
  ctx.fillStyle = '#39ff88';
  ctx.fillRect(0, 0, 64, 8);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

// KEEP-DORMANT (P44, harmless here): a weapon-less Scout can never fire, so
// the kill/death path is structurally unreachable in explore mode. Left in for
// combat-mode fidelity; explore mode never triggers it.
function beginDeath(id){
  const e = shipMeshes.get(id);
  if (!e || e.dying) return;
  e.dying = 0; e.mat.emissive.setHex(DYING_FLASH); e.mat.emissiveIntensity = 1.0;
}
function removeShip(e){ scene.remove(e.mesh); e.mat.dispose();
  e.bar.material.map?.dispose(); e.bar.material.dispose(); e.mesh.geometry.dispose();
  shipMeshes.delete(e.mesh.userData.id); shipState.delete(e.mesh.userData.id); }

// ─────────────────────── non-ship model lifecycle (P204) ────────────────────
// Mirror the ship path: spawn a per-kind coloured sphere on first sight,
// update it in place every tick, and prune it once GHOST_TICKS pass without
// the model reappearing. Short-lived kinds (projectile, chaff) are removed
// from Sector.Models the tick they expire/hit (Projectile.OnUpdate /
// Chaff.OnUpdate — see the class remarks in Sim/) and so simply stop appearing
// in the stream; the existing staleness rule then cleans them up naturally —
// no separate expiry timer needed.
function spawnModel(mo){
  const st = MODEL_STYLE[mo.kind] || MODEL_STYLE.projectile;
  const mat = new THREE.MeshStandardMaterial({
    color: st.color, emissive: new THREE.Color(st.color),
    emissiveIntensity: 0.5, roughness: 0.6, metalness: 0.2 });
  const mesh = new THREE.Mesh(MODEL_GEO.clone(), mat);
  mesh.userData.id = mo.id;
  mesh.userData.kind = mo.kind;
  const e = { mesh, mat };
  modelMeshes.set(mo.id, e);
  scene.add(mesh);
  updateModelVisual(mo, e);
  return e;
}
function updateModelVisual(mo, e){
  e.mesh.position.set(mo.pos[0], mo.pos[1], mo.pos[2]);
  const s = (MODEL_STYLE[mo.kind] || MODEL_STYLE.projectile).scale;
  // Guided munitions (projectile/missile) are elongated along their fwd axis
  // to suggest a motion trail; everything else stays a plain sphere.
  if (mo.fwd && mo.fwd.length === 3){
    const fwd = new THREE.Vector3(mo.fwd[0], mo.fwd[1], mo.fwd[2]);
    if (fwd.lengthSq() > 0){
      e.mesh.quaternion.setFromUnitVectors(UP, fwd.clone().normalize());
      e.mesh.scale.set(s, s, s * 3);
      return;
    }
  }
  e.mesh.quaternion.identity();
  e.mesh.scale.set(s, s, s);
}
function removeModel(e){
  scene.remove(e.mesh);
  e.mat.dispose();
  e.mesh.geometry.dispose();
  modelMeshes.delete(e.mesh.userData.id);
  modelState.delete(e.mesh.userData.id);
}

// P204 — adopt the fight sector as the focus once the ship stream is
// classified as combat. Combat ships carry no `sector` field (unlike explore
// ships), so the tick handler can never nominate a focus from them; drawing
// the fight's static geometry needs a focus, so we adopt the first cached
// sector message (the fight scenario's single sector). Guarded so it never
// steals explore's first-ship focus rule.
function maybeAdoptCombatFocus(){
  if (modeClassified && !exploreMode && focusId === null && sectors.size > 0){
    focusId = [...sectors.keys()][0];
    selEl.value = String(focusId);
    drawFocusGeometry();
    reframeCamera();
  }
}

// ─────────────────────────── websocket + event loop ─────────────────────────
// Drop every tracked ship/model (meshes out of the scene, maps cleared) —
// called on each (re)connect. A reconnect usually means a fresh backend
// (attach container restarts renumber every ship from scratch), so anything
// still tracked from the previous socket is stale: its ids can collide with
// the new stream's, and its meshes would linger in the scene until ghost
// pruning got to them. Sectors/focus survive (static geometry, stable ids);
// the census re-arrives on the first tick of the new stream.
function resetShipState(){
  for (const e of shipMeshes.values()) removeShip(e);
  for (const e of modelMeshes.values()) removeModel(e);
  shipState.clear(); shipMeshes.clear();
  modelState.clear(); modelMeshes.clear();
  sectorCensus = null;
}

function connect(){
  if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
  resetShipState();
  hudEl.textContent = 'connecting…';
  statsEl.textContent = 'ws: connecting';
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    connCount++;
    hudEl.textContent = `connected (${connCount}). ${exploreMode ? 'explore mode — watching real ScoutExploreMap' : 'combat view — side 0 shoots, side 1'}. drag: orbit • wheel: zoom • right-drag: pan`;
    renderHUD();
  };
  ws.onmessage = ev => { try { handle(JSON.parse(ev.data)); } catch(err){ hudEl.textContent = `bad frame: ${err.message}`; } };
  ws.onclose = () => { hudEl.textContent = 'disconnected — reconnecting…'; scheduleReconnect(); };
  ws.onerror = () => {};
}
function scheduleReconnect(){ reconnectTimer = setTimeout(connect, 2500); }

// One DOM field in the HUD: the focused sector name + ship count + a compact
// "other active sectors" list, so a viewer knows there's activity elsewhere.
function renderHUD(){
  const parts = [];
  // Real per-sector counts (attach mode) beat the fake explore-only
  // st.sector filter, which is always 0 for combat ships (they carry no
  // per-ship sector field on the wire — see the sectorCensus comment above).
  function countIn(id){
    if (sectorCensus) return sectorCensus[String(id)] ?? 0;
    return exploreMode ? [...shipState.values()].filter(st => st.sector === id).length : null;
  }
  if (focusId !== null && sectors.has(focusId)){
    const sec = sectors.get(focusId);
    const real = countIn(focusId);
    const n = real !== null ? real : shipMeshes.size;   // last-resort fallback: no census, no explore data
    parts.push(`focus: ${sec.name} (${n} ship${n===1?'':'s'})`);
  } else {
    parts.push(exploreMode ? 'waiting for a ship to set focus…' : 'combat view');
  }
  const others = [...sectors.keys()]
    .filter(id => id !== focusId)
    .map(id => `${sectors.get(id).name} (${countIn(id) ?? 0})`);
  if (others.length) parts.push(`active: ${others.join(', ')}`);
  infoEl.textContent = parts.join('  ·  ');
  statsEl.textContent =
    `ws: ${ws && ws.readyState === WebSocket.OPEN ? 'open' : 'closed'} · ships: ${shipMeshes.size} · models: ${modelMeshes.size} · sim: ${simTime.toFixed(1)} · conn: ${connCount} · sectors: ${sectors.size} · focus: ${focusId ?? '—'}`;
}

function handle(m){
  if (m.type === 'tick'){
    simTime = m.simTime;
    tickCount++;
    // P204: classify explore vs combat once, from the first ship-bearing
    // tick (explore ships always carry a real `sector`; combat ships never
    // do). The fight scenario now sends sector geometry too, so a sector
    // message can no longer be the mode signal. A momentarily empty tick
    // (m.ships.length === 0) leaves the mode provisional.
    if (!modeClassified && m.ships.length){
      exploreMode = m.ships.some(s => s.sector != null && s.sector >= 0);
      modeClassified = true;
      if (exploreMode)
        hudEl.textContent = `connected (${connCount}). explore mode — watching real ScoutExploreMap. drag: orbit • wheel: zoom • right-drag: pan`;
    }
    let newlyFocused = false;
    for (const s of m.ships){
      const prev = shipState.get(s.id);
      s.lastSeenTick = tickCount;                  // P49: stamp freshness on the stored value
      shipState.set(s.id, s);
      // Default focus = the sector the FIRST ship you ever see is in. Leave it
      // fixed afterwards unless the user changes it via the dropdown.
      if (focusId === null && s.sector != null && s.sector >= 0){
        focusId = s.sector;
        selEl.value = String(focusId);
        rebuildSelector();
        newlyFocused = true;
      }
      if (!shipMeshes.has(s.id)){ spawnShip(s); }
      else {
        const e = shipMeshes.get(s.id);
        updateShipVisual(s, e);
        // Re-check scene membership on every tick: a ship with a real
        // `realSector` can genuinely cross into/out of the focused sector
        // over time (attach mode's cross-side rendezvous), unlike an
        // explore-mode ship, whose sector was fixed for the whole session —
        // the old assumption this used to skip. shipMatchesFocus falls
        // through to the classic rules for ships with no sector info.
        const match = shipMatchesFocus(s);
        const inScene = scene.getObjectById(e.mesh.id) === e.mesh;
        if (match && !inScene) scene.add(e.mesh);
        else if (!match && inScene) scene.remove(e.mesh);
      }
    }
    // P49: prune ghosts. Any ship that hasn't appeared in this many consecutive
    // ticks is dropped entirely (mesh + state + scene) via removeShip, before the
    // visible-set/scene logic so a pruned ship never lingers in either. A live
    // ship was stamped lastSeenTick == tickCount above, so it's immune.
    for (const [id, e] of shipMeshes){
      const st = shipState.get(id);
      if (st && (tickCount - (st.lastSeenTick ?? tickCount)) > GHOST_TICKS) removeShip(e);
    }
    // P204: non-ship models — spawn-on-first-sight / update-in-place /
    // prune-on-staleness, the same lifecycle ships use above. Short-lived
    // kinds disappear from Sector.Models on expiry and stop appearing here,
    // so the shared GHOST_TICKS rule prunes them; no separate timer.
    for (const mo of (m.models || [])){
      modelState.set(mo.id, { lastSeenTick: tickCount });
      if (!modelMeshes.has(mo.id)) spawnModel(mo);
      else updateModelVisual(mo, modelMeshes.get(mo.id));
    }
    for (const [id, e] of modelMeshes){
      const mst = modelState.get(id);
      if (mst && (tickCount - (mst.lastSeenTick ?? tickCount)) > GHOST_TICKS) removeModel(e);
    }
    // P204: once classified combat, adopt the fight sector as the focus so
    // its static geometry is drawn (see maybeAdoptCombatFocus).
    maybeAdoptCombatFocus();
    // Per-tick enforcement sweep. This MUST use the same shipMatchesFocus
    // rule as applyFocus/spawnShip — the pre-fix version hardcoded
    // `exploreMode ? … : true`, i.e. "every combat ship is always visible",
    // which re-added every attach-mode ship to the scene on the very next
    // tick after applyFocus()/the re-check above had correctly removed it
    // (observed live: removals took effect for <1s, then all meshes were
    // back with no corresponding add-site in the instrumented paths — this
    // uninstrumented sweep was the re-adder).
    const visible = new Set([...shipMeshes.keys()]
      .filter(id => shipMatchesFocus(shipState.get(id))));
    for (const [id, e] of shipMeshes){
      const wanted = visible.has(id);
      const inScene = scene.getObjectById(e.mesh.id) === e.mesh;
      if (wanted && !inScene) scene.add(e.mesh);
      else if (!wanted && inScene) scene.remove(e.mesh);
    }
    // First-ever focus: draw its geometry + frame the camera now (the normal
    // path — dropdown change — hasn't happened yet). Subsequent focus changes
    // come through selEl 'change' → applyFocus.
    if (newlyFocused) {
      applyFocus();
    } else {
      // Auto-follow (see the controls.addEventListener('start', ...) comment
      // above): only when the user hasn't touched the camera recently, and
      // only at a slow cadence — reframeCamera() already re-fits to every
      // visible ship's CURRENT position, so calling it here is what actually
      // keeps a ship that flew out of the original frame back in view.
      const now = performance.now();
      if (now - lastUserCameraInputMs > AUTO_REFRAME_IDLE_MS &&
          now - lastAutoReframeMs > AUTO_REFRAME_INTERVAL_MS) {
        lastAutoReframeMs = now;
        followShips();
      }
      renderHUD();
    }
    return;
  }
  if (m.type === 'sector'){
    // ← P45 one-time static geometry. Record it (dedupe by id). P204 NOTE:
    // this NO LONGER flips the page into explore mode — the fight scenario
    // now sends sector geometry too, so a sector message no longer implies
    // explore; mode is classified from the ship frames in the tick handler.
    // The dropdown is revealed in both modes (harmless; the fight scenario
    // has a single sector).
    selEl.style.display = '';
    if (!sectors.has(m.id)) sectors.set(m.id, m);
    else sectors.get(m.id).warps = m.warps;          // refresh coords defensively
    rebuildSelector();
    // In combat the ships carry no `sector` to nominate a focus, so once the
    // stream is classified combat we adopt the fight sector here too (see
    // maybeAdoptCombatFocus) — draws the static geometry under that focus.
    maybeAdoptCombatFocus();
    // If this sector message arrives for the ALREADY-focused sector (geometery
    // sometimes trails the first ship tick in backend emission order), draw it
    // now rather than waiting for a dropdown change. Cheap: no-op if geometry
    // already drawn for the current focus (drawFocusGeometry clears first).
    if (focusId === m.id) { drawFocusGeometry(); reframeCamera(); }
    renderHUD();
    return;
  }
  if (m.type === 'kill'){
    // combat-only; structurally impossible in explore (weapon-less Scout).
    beginDeath(m.victim);
    // Audio proof-of-concept: the victim's last known position already lives
    // in shipState from the tick stream (no server-side change needed for
    // this) -- fall back silently if it somehow isn't tracked yet.
    const st = shipState.get(m.victim);
    if (st) playPositional(st.pos);
    return;
  }
  if (m.type === 'event'){
    // P59: one notable moment per line, capped so the feed can't grow unbounded
    // over a long-running demo (oldest dropped once the cap is exceeded).
    appendEvent(m.text);
    return;
  }
  if (m.type === 'sectorCensus'){
    sectorCensus = m.counts;
    renderHUD();
    return;
  }
}

// P59: append a line to the live event feed, dropping the oldest once more
// than EVENT_CAP lines are held. The server text is used verbatim (the same
// string the server console logged), so the feed always matches the log.
const EVENT_CAP = 30;
function appendEvent(text){
  const line = document.createElement('div');
  line.textContent = text;
  eventsFeedEl.appendChild(line);
  while (eventsFeedEl.childElementCount > EVENT_CAP) eventsFeedEl.firstChild.remove();
}

// Dropdown → change focus: redraw geometry, reframe camera, reshuffle ships.
selEl.addEventListener('change', () => {
  focusId = selEl.value === '' ? null : Number(selEl.value);
  applyFocus();
});

// Diagnostics hook (not used by the render path): exposes the live viewer
// state so a driver can assert numerics (focus, tracked ships incl. their
// sectors, which meshes are currently in the scene) headlessly.
window.__vstate = () => ({
  exploreMode,
  focusId,
  sectors: [...sectors.keys()].map(id => ({ id, name: sectors.get(id).name })),
  ships: [...shipState.entries()].map(([id, s]) => ({
    id, sector: s.sector,
    x:+s.pos[0].toFixed(1), y:+s.pos[1].toFixed(1), z:+s.pos[2].toFixed(1),
    inScene: scene.getObjectById(shipMeshes.get(id)?.mesh.id) === shipMeshes.get(id)?.mesh
  })),
  geometryChildren: geomGroup.children.length,
});

// Audio proof-of-concept diagnostic hook (temporary, matches __vstate's
// pattern): lets an outside driver trigger the exact same playback path a
// real kill uses, without needing a live fight to actually resolve one.
window.__testAudio = (pos) => playPositional(pos ?? [0, 0, 0]);

// animation loop
const clock = new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  // Combat-only death anim; inert in explore (no dying flags set).
  for (const e of shipMeshes.values()){
    if (e.dying && e.dying > 0){ e.dying += dt; removeShip(e); }
  }
  renderer.render(scene, camera);
})();

connect();
</script>
</body>
