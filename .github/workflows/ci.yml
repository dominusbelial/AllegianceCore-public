# CI for AllegianceCore.
#
# Goal: give a (future open-source) contributor's PR build + test feedback.
# There was no CI before this file existed.
#
# The corpus-backed tests (those tagged [Trait("Requires","Artwork")] /
# [Trait("Requires","NativeSource")]) are driven by the real .igc/.cvh artwork
# corpus, a large external checkout deliberately NOT in this repo. On a
# GitHub-hosted runner that corpus is absent, so those tests are filtered OUT
# here and the remaining (corpus-independent) tests run as a hard gate with NO
# continue-on-error. On a machine with the corpus they still run and pass
# (locally via scripts/run-tests.sh, which loads the gitignored local.env).
# See docs/P597_PRIVATE_PATHS_AND_CLEAN_CLONE.md.

name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        # After the solution + 70 tool builds / was at 69 of 72 GB (run 39719882426).
        # Drop preinstalled toolchains this job never uses (same list as release.yml).
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v4

      - name: Setup .NET SDK (pinned 10.0.400)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Build solution
        run: dotnet build AllegianceCore.slnx

      - name: Build every tools/ project
        # The solution references a subset of tools/; the *-proof harnesses are standalone
        # projects that must also compile (P602). --drop-bins deletes each unused bin/ after
        # its build (~340 MB each; all 70 ran the runner out of disk, run 39719003509).
        run: tools/build-tools.sh --drop-bins

      - name: GLOSSARY.md link check
        # P811 — the agent-maintained per-domain index must never cite a path
        # that does not exist in the tree.
        run: python3 tools/check-glossary-links.py

      - name: Test Fast tier (non-corpus gate)
        env:
          TEST_FILTER: "Requires!=Artwork&Requires!=NativeSource&Requires!=Gpu&Requires!=MeshyPack&Lane!=LiveTiming"
        run: tools/run-tests.sh --tier fast --no-build

      - name: Headless replay benchmark (three deterministic runs, no server or artwork)
        run: >-
          dotnet tools/benchmark/bin/Debug/net10.0/benchmark.dll
          --benchmark replay:data/benchmarks/battle.alr --benchmark-headless
          --benchmark-output /tmp/benchmark-replay.json

      - name: Benchmark comparison checks
        run: python3 -m unittest discover -s packaging -p 'test_bench_compare.py'

      - name: Upload tier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-tiers
          retention-days: 7
          path: TestResults/
