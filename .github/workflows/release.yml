name: player-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - run: sudo apt-get update && sudo apt-get install -y libfreetype6
      - run: dotnet tool restore
      - run: dotnet build AllegianceCore.slnx -m:1 -p:AutoRestoreMGCBTool=false
      - name: Existing CI test gate
        run: dotnet test AllegianceCore.slnx --no-build --filter "Requires!=Artwork&Requires!=NativeSource&Lane!=LiveTiming"
      - name: Packaging unit tests
        run: python3 -m unittest discover -s packaging -p 'test_*.py'

  package:
    needs: test
    # DesktopGL Content is platform-independent. Cross-publish the Windows
    # apphost/runtime/native assets on Linux; test that binary on Windows below.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rid: [linux-x64, win-x64, osx-arm64]
    steps:
      - name: Free runner disk space
        # The AppImage step (bundle + tar.gz + squashfs) ran / out of space on the 72 GB image
        # (70 GB used, 2 GB free; run 39717034202). Drop preinstalled toolchains this job never uses.
        if: matrix.rid == 'linux-x64'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - run: sudo apt-get update && sudo apt-get install -y libfreetype6
      - run: dotnet tool restore
      - name: Fetch pinned AppImage tools
        if: matrix.rid == 'linux-x64'
        run: python3 packaging/fetch-appimage-tools.py "$RUNNER_TEMP/appimage-tools"
      - name: Build player artifacts
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version=0.0.1
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${RELEASE_REF#v}"; fi
          if [[ '${{ matrix.rid }}' == linux-x64 ]]; then
            python3 packaging/package.py --rid linux-x64 --format all --version "$version" \
              --appimagetool "$RUNNER_TEMP/appimage-tools/appimagetool" \
              --appimage-runtime "$RUNNER_TEMP/appimage-tools/runtime-x86_64"
          else
            python3 packaging/package.py --rid '${{ matrix.rid }}' --format portable --version "$version"
          fi
      - name: Disk usage
        if: always() && matrix.rid == 'linux-x64'
        run: df -h / "$RUNNER_TEMP" && du -sh dist dist/* 2>/dev/null | sort -h | tail -8
      - name: Check full-source census against manifest
        if: matrix.rid == 'linux-x64'
        run: >-
          ALLEGIANCE_ARTWORK_PATH="$PWD/dist/sources/artwork"
          dotnet src/Allegiance.ClientCore.MonoGame/bin/Release/net10.0/${{ matrix.rid }}/Allegiance.ClientCore.MonoGame.dll
          --asset-census --manifest packaging/artwork-manifest.txt
          --roots packaging/artwork-roots.txt --asset-manifest dist/census-${{ matrix.rid }}.json
      - name: Linux extracted bundle smoke
        if: matrix.rid == 'linux-x64'
        run: python3 packaging/smoke.py dist/Allegiance-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.rid }}
          path: |
            dist/Allegiance-*.tar.gz
            dist/Allegiance-*.zip
            dist/Allegiance-*.AppImage
            dist/Allegiance-*.sha256
            dist/Allegiance-*.json
            dist/census-*.json
          if-no-files-found: error

  windows-smoke:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: player-win-x64
          path: dist
      - name: Windows extracted bundle smoke (native apphost)
        run: python packaging/smoke.py dist/Allegiance-win-x64.zip
      - name: Build Inno Setup installer from the verified portable payload
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = '0.0.1'
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $version = $env:RELEASE_REF.TrimStart('v') }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (!$iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          python packaging/package.py --rid win-x64 --format installer --version $version `
            --from-portable dist/Allegiance-win-x64.zip --iscc $iscc
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          if ([version]$version -le [version]'0.0.0') { throw 'Release version must exceed 0.0.0 for upgrade smoke' }
          python packaging/package.py --rid win-x64 --format installer --version 0.0.0 `
            --from-portable dist/Allegiance-win-x64.zip --iscc $iscc --output "$env:RUNNER_TEMP/previous-installer"
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer build failed' }
      - name: Silent per-user and all-users install, asset check and uninstall
        run: >-
          ./packaging/smoke-windows.ps1 -Installer dist/Allegiance-win-x64-setup.exe
          -Portable dist/Allegiance-win-x64.zip
          -PreviousInstaller "$env:RUNNER_TEMP/previous-installer/Allegiance-win-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: player-win-installer
          path: |
            dist/Allegiance-*-setup.exe
            dist/Allegiance-*-setup.exe.sha256
            dist/Allegiance-*-setup.exe.json
          if-no-files-found: error

  appimage-smoke:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu, fedora]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: player-linux-x64
          path: dist
      - name: Build stock distribution smoke environment
        run: docker build -f packaging/Dockerfile.smoke-${{ matrix.distro }} -t allegiance-smoke packaging
      - name: AppImage runtime and extracted/offline smoke with no internet
        run: |
          chmod +x dist/Allegiance-linux-x64.AppImage
          intro=''
          if [[ '${{ matrix.distro }}' == ubuntu ]]; then intro=--intro; fi
          docker run --rm --network none --read-only --user 1000:1000 \
            --tmpfs /tmp:exec,mode=1777 \
            -v "$PWD/dist:/artifacts:ro" -v "$PWD/packaging:/packaging:ro" \
            allegiance-smoke sh /packaging/smoke-appimage.sh /artifacts/Allegiance-linux-x64.AppImage $intro

  macos-smoke:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: player-osx-arm64
          path: dist
      - name: macOS extracted app smoke (native arm64 apphost, headless census)
        run: python3 packaging/smoke.py dist/Allegiance-osx-arm64.zip
      - name: Verify ditto extraction preserves app executables
        run: |
          ditto -x -k dist/Allegiance-osx-arm64.zip "$RUNNER_TEMP/ditto-player"
          app="$RUNNER_TEMP/ditto-player/Allegiance-osx-arm64/AllegianceCore.app"
          test -x "$app/Contents/MacOS/Allegiance"
          test -x "$app/Contents/Resources/Allegiance"
          cd "$RUNNER_TEMP"
          env -u ALLEGIANCE_ARTWORK_PATH -u ALLEGIANCE_SKY_PACK_PATH "$app/Contents/MacOS/Allegiance" --check-assets

  publish:
    needs: [package, windows-smoke, macos-smoke, appimage-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'dominusbelial/AllegianceCore-public'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: player-*
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        working-directory: dist
        run: |
          cat Allegiance-*.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish portable bundles and installers together after smoke gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag --title "AllegianceCore $RELEASE_TAG"
          --notes-file packaging/RELEASE-NOTES.md
          dist/Allegiance-*.tar.gz dist/Allegiance-*.zip dist/Allegiance-*.AppImage dist/Allegiance-*-setup.exe
          dist/SHA256SUMS.txt dist/Allegiance-*.json
